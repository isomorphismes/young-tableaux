name: Independent mathematical audit
on:
  pull_request:
    branches: [main, tables]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Qualify current division-glyph host frontend
        id: ick
        uses: isomorphisms/ai-ci/ick-host@4ea071a96239f3a29ca6d98454feb59947d87cfe
      - name: Kill mathematical mutants
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          compiler = pathlib.Path('${{ steps.ick.outputs.compiler }}')
          subprocess.run([sys.executable, 'tests/audit_mutations.py', '--compiler', str(compiler)], check=True)
      - name: Check all operations against independent oracles
        if: always()
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          compiler = pathlib.Path('${{ steps.ick.outputs.compiler }}')
          subprocess.run([sys.executable, 'tests/independent_audit.py', '--compiler', str(compiler)], check=True)
      - name: Preserve mathematical counterexamples and mutation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-mathematical-audit
          path: |
            build/independent-audit.tsv
            build/public-dispatch.tsv
            build/mutations/*.tsv
            build/mutations/*.log
      - name: Check renderer integer bounds when the plot is present
        if: always()
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          compiler = pathlib.Path('${{ steps.ick.outputs.compiler }}')
          subprocess.run([sys.executable, 'tests/audit_renderer.py', '--compiler', str(compiler)], check=True)
      - name: Accepted Ithon frontend for the current operation ledger
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: 74ab6d6044b07b76a910978437a34a6b5ac6acda
          path: .ithon
          persist-credentials: false
      - name: Require and emit all 44 operation verdicts
        env:
          ITHON_PYTHON: python3
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/ledger-source-checks.ndjson
        run: .ithon/ithon tests/emit_operation_ledger.pi
      - name: Preserve the exact-head operation ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operation-ledger-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/current-44-operation-ledger.tsv
            build/render-audit/receipt.tsv
            ${{ runner.temp }}/ledger-source-checks.ndjson
          if-no-files-found: error
