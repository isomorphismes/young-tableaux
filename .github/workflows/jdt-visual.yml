name: Jeu de taquin pixel and typed provenance contract

on:
  pull_request:
    branches: [tables]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualified-ick:
    runs-on: ubuntu-24.04
    steps:
      - name: Qualify and retain the exact compiler before consumer execution
        uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
      - name: Archive the qualified compiler for reproducible host comparisons
        run: tar -C "${{ runner.temp }}" -czf "${{ runner.temp }}/ick-host-stage.tar.gz" ick-host-stage
      - name: Split the archive into independently retrievable parts
        run: split -b 400M "${{ runner.temp }}/ick-host-stage.tar.gz" "${{ runner.temp }}/ick-host-stage.part-"
      - name: Preserve the qualified compiler and runtime closure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: young-qualified-host-aa-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ick-host-stage.part-aa
          if-no-files-found: error
      - name: Preserve the second compiler archive part
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: young-qualified-host-ab-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ick-host-stage.part-ab
          if-no-files-found: error

  observable-jdt:
    needs: qualified-ick
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR-head source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Qualify current division-glyph host frontend
        id: ick
        uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
      - name: Check out accepted mandatory Ithon frontend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: 74ab6d6044b07b76a910978437a34a6b5ac6acda
          path: .ithon
          persist-credentials: false
      - name: Execute real painter and reject silent mutants
        env:
          ITHON_PYTHON: python3
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/jdt-source-checks.ndjson
        run: >-
          .ithon/ithon tests/jeu_visual_contract.pi
          --compiler "${{ steps.ick.outputs.compiler }}"
          --compiler-flag=-fno-link-libatomic
      - name: Show the actual native receipt
        run: cat build/jdt-visual-evidence/receipt.tsv
      - name: Reject the ten restored audit defects
        env:
          ITHON_PYTHON: python3
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/repair-source-checks.ndjson
        run: .ithon/ithon tests/repair_negative_controls.pi --compiler "${{ steps.ick.outputs.compiler }}"
      - name: Preserve positive and negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jdt-visual-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/jdt-visual-evidence/
            build/repair-negative-controls/
            ${{ runner.temp }}/jdt-source-checks.ndjson
            ${{ runner.temp }}/repair-source-checks.ndjson
          if-no-files-found: warn

  typed-jdt:
    needs: qualified-ick
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact mathematical consumer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Qualify explicit ICK for native trace comparison
        id: ick
        uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
      - name: Exact accepted Idriç compiler bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/catfood
          run-id: 38090627721
          artifact-ids: 11684276190
          merge-multiple: true
          github-token: ${{ github.token }}
          path: idric-runtime
      - name: Verify compiler bundle identity
        run: sha256sum -c ci/idric-bundle.sha256
      - name: Restore exact compiler and Chez runtime
        run: tar --no-same-owner -xzf idric-runtime/idric-linux-x86_64-94dfd99bd3e376507fedc8611053b7173b2519f0.tar.gz -C idric-runtime
      - name: Accepted mandatory Ithon frontend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: 74ab6d6044b07b76a910978437a34a6b5ac6acda
          path: .ithon
          persist-credentials: false
      - name: Execute Idriç transitions and reject compiled semantic mutants
        env:
          ITHON_PYTHON: python3
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/typed-source-checks.ndjson
        run: >-
          .ithon/ithon tests/typed_jeu_contract.pi
          --compiler "${{ steps.ick.outputs.compiler }}"
          --idric "$GITHUB_WORKSPACE/idric-runtime/idric-linux-x86_64-94dfd99bd3e376507fedc8611053b7173b2519f0/bin/idric"
          --idric-env "$GITHUB_WORKSPACE/idric-runtime/idric-linux-x86_64-94dfd99bd3e376507fedc8611053b7173b2519f0/bin/idric-env"
      - name: Preserve actual compiler and trace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typed-jdt-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/typed-jeu-evidence/
            ${{ runner.temp }}/typed-source-checks.ndjson
          if-no-files-found: error
