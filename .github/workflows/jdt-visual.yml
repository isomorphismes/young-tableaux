name: Jeu de taquin pixel and typed provenance contract

on:
  pull_request:
    branches: [tables]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualified-ick:
    runs-on: ubuntu-24.04
    steps:
      - name: Qualify and retain the exact compiler before consumer execution
        uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
      - name: Archive the qualified compiler for reproducible host comparisons
        run: tar -C "${{ runner.temp }}" -czf "${{ runner.temp }}/ick-host-stage.tar.gz" ick-host-stage
      - name: Preserve the qualified compiler and runtime closure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: young-qualified-host-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ick-host-stage.tar.gz
          if-no-files-found: error

  observable-jdt:
    needs: qualified-ick
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR-head source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Qualify current division-glyph host frontend
        id: ick
        uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
      - name: Check out accepted mandatory Ithon frontend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: 74ab6d6044b07b76a910978437a34a6b5ac6acda
          path: .ithon
          persist-credentials: false
      - name: Execute real painter and reject silent mutants
        env:
          ITHON_PYTHON: python3
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/jdt-source-checks.ndjson
        run: >-
          .ithon/ithon tests/jeu_visual_contract.pi
          --compiler "${{ steps.ick.outputs.compiler }}"
          --compiler-flag=-fno-link-libatomic
      - name: Show the actual native receipt
        run: cat build/jdt-visual-evidence/receipt.tsv
      - name: Preserve positive and negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jdt-visual-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/jdt-visual-evidence/
            ${{ runner.temp }}/jdt-source-checks.ndjson
          if-no-files-found: warn

  typed-jdt:
    needs: qualified-ick
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact mathematical consumer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin actual Idriç compiler source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/Idric
          ref: 94dfd99bd3e376507fedc8611053b7173b2519f0
          path: idric-toolchain
          persist-credentials: false
      - name: Qualify explicit ICK for the compiler's native support
        id: ick
        uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
      - name: Build owned Idriç compiler
        env:
          CC: ${{ steps.ick.outputs.compiler }}
          CFLAGS: -fno-link-libatomic -static-libgcc
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl python3 util-linux
          ( cd idric-toolchain/_ && ./edric all )
          test -x idric-toolchain/_/build/exec/idris2
      - name: Typecheck and execute signed-neighbor/provenance rules
        shell: bash
        run: |
          set -euo pipefail
          compiler="$GITHUB_WORKSPACE/idric-toolchain/_/build/exec/idris2"
          export PATH="$GITHUB_WORKSPACE/idric-toolchain/_/.tools/bin:$PATH"
          export IDRIS2_PREFIX="$GITHUB_WORKSPACE/idric-toolchain/_/build/env"
          "$compiler" --source-dir types --check types/YoungTableaux/JeuTrace.idric
          IDRIS2_PATH="$GITHUB_WORKSPACE/build/ttc" "$compiler" \
            --source-dir examples/autogenerated/jeu-trace \
            -o jeu-trace-checks \
            examples/autogenerated/jeu-trace/JeuTraceChecks.idric
          build/exec/jeu-trace-checks
